
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valve AI — Image Generator</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b12;color:#f5f5ff;font-family:Arial,sans-serif;padding:24px}
main{max-width:680px;margin:35px auto}
h1{font-size:36px;margin-bottom:8px}
p{color:#b9b9ca;line-height:1.5}
.card{background:#171722;border:1px solid #303044;border-radius:18px;padding:22px}
textarea{width:100%;min-height:110px;resize:vertical;background:#0c0c14;color:white;border:1px solid #39394d;border-radius:12px;padding:14px;font-size:16px}
button{border:0;border-radius:10px;padding:13px 17px;font-size:15px;font-weight:bold;cursor:pointer;margin:8px 5px 8px 0}
.primary{background:#9b7bff;color:#100d1c}
.secondary{background:#303044;color:white}
#status{white-space:pre-wrap;font-size:14px}
img{width:100%;border-radius:12px;margin-top:15px}
small{color:#aaa}
</style>
</head>
<body>
<main>
  <h1>⚡ Valve AI</h1>
  <p>Turn your imagination into images.</p>
  <section class="card">
    <label for="prompt"><b>Describe your image</b></label>
    <p><textarea id="prompt" placeholder="A cinematic futuristic city at sunset, ultra detailed..."></textarea></p>
    <button class="primary" id="generate">Generate Image</button>
    <button class="secondary" id="connect">Connect Pollinations</button>
    <p id="status">Connect your account before generating.</p>
    <img id="result" alt="Generated image" hidden>
    <p><a id="download" hidden style="color:#c5b5ff">Download image</a></p>
    <small>Generation may use your account's available credits.</small>
  </section>
</main>
<script>
const CLIENT_ID = "pk_Duj0cn8yqtnAjDld";
const REDIRECT_URI = "https://sohailthegreat.github.io/Valve-AI/";
const statusBox = document.getElementById("status");

function randomString(length=64){
  const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";
  const bytes=crypto.getRandomValues(new Uint8Array(length));
  return Array.from(bytes,b=>chars[b%chars.length]).join("");
}
function base64url(bytes){
  let s="";
  bytes.forEach(b=>s+=String.fromCharCode(b));
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
async function sha256(text){
  return new Uint8Array(await crypto.subtle.digest(
    "SHA-256",new TextEncoder().encode(text)
  ));
}

async function connect(){
  if(CLIENT_ID==="paste_your_pk_key_here"){
    statusBox.textContent="Setup needed: add your Pollinations public client ID in the code.";
    return;
  }
  const verifier=randomString();
  const state=randomString(32);
  sessionStorage.setItem("valve_verifier",verifier);
  sessionStorage.setItem("valve_state",state);
  const challenge=base64url(await sha256(verifier));
  const url=new URL("https://enter.pollinations.ai/authorize");
  url.searchParams.set("response_type","code");
  url.searchParams.set("client_id",CLIENT_ID);
  url.searchParams.set("redirect_uri",REDIRECT_URI);
  url.searchParams.set("scope","profile usage");
  url.searchParams.set("state",state);
  url.searchParams.set("code_challenge",challenge);
  url.searchParams.set("code_challenge_method","S256");
  url.searchParams.set("models","image");
  location.href=url.toString();
}

async function handleCallback(){
  const params=new URLSearchParams(location.search);
  const code=params.get("code");
  if(!code)return;
  const state=params.get("state");
  const savedState=sessionStorage.getItem("valve_state");
  const verifier=sessionStorage.getItem("valve_verifier");
  history.replaceState({},"",REDIRECT_URI);
  if(!state||state!==savedState||!verifier){
    statusBox.textContent="Authorization check failed. Please connect again.";
    return;
  }
  statusBox.textContent="Connecting account...";
  try{
    const body=new URLSearchParams({
      grant_type:"authorization_code",
      code,
      client_id:CLIENT_ID,
      redirect_uri:REDIRECT_URI,
      code_verifier:verifier
    });
    const response=await fetch("https://enter.pollinations.ai/api/oauth/token",{
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:body.toString()
    });
    const data=await response.json();
    if(!response.ok||!data.access_token){
      throw new Error(data.error_description||data.error||"Token exchange failed");
    }
    sessionStorage.setItem("valve_access_token",data.access_token);
    statusBox.textContent="Account connected! You can generate an image.";
  }catch(error){
    statusBox.textContent="Could not connect: "+error.message;
  }finally{
    sessionStorage.removeItem("valve_verifier");
    sessionStorage.removeItem("valve_state");
  }
}

async function generate(){
  const prompt=document.getElementById("prompt").value.trim();
  const token=sessionStorage.getItem("valve_access_token");
  if(!prompt){
    statusBox.textContent="Please enter an image prompt first.";
    return;
  }
  if(!token){
    statusBox.textContent="Tap Connect Pollinations and authorize first.";
    return;
  }
  const button=document.getElementById("generate");
  button.disabled=true;
  statusBox.textContent="Generating image... Please wait.";
  try{
    const url="https://gen.pollinations.ai/image/"+encodeURIComponent(prompt)
      +"?model=black-forest-labs/flux.1-schnell";
    const response=await fetch(url,{
      headers:{Authorization:"Bearer "+token}
    });
    if(!response.ok){
      throw new Error("Generation failed ("+response.status+"). Check account credits and permissions.");
    }
    const blob=await response.blob();
    const imageURL=URL.createObjectURL(blob);
    const img=document.getElementById("result");
    const link=document.getElementById("download");
    img.src=imageURL;
    img.hidden=false;
    link.href=imageURL;
    link.download="valve-ai-image.png";
    link.hidden=false;
    statusBox.textContent="Image generated successfully!";
  }catch(error){
    statusBox.textContent="Error: "+error.message;
  }finally{
    button.disabled=false;
  }
}
document.getElementById("connect").addEventListener("click",connect);
document.getElementById("generate").addEventListener("click",generate);
handleCallback();
</script>
</body>
</html>
